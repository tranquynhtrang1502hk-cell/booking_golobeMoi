<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Golobe</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Montserrat) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <!-- Cột bên trái: Form Login giữ nguyên tính năng cũ -->
        <div class="auth-form-side">
            <!-- Logo -->
            <a href="index.html" class="auth-logo">
                <i class="fa-solid fa-paper-plane" style="color: #8DD3BB;"></i>
                <span>g<span style="color: #8DD3BB;">o</span>lobe</span>
            </a>

            <!-- Heading -->
            <div class="auth-header" style="text-align: left; width: 100%; max-width: 400px;">
                <h2 style="font-size: 32px; font-weight: 700; margin-bottom: 8px;">Login</h2>
                <p style="color: #79747E; font-size: 14px; margin-bottom: 32px;">Login to access your Golobe account</p>
            </div>

            <!-- Form -->
            <form id="login-form" style="width: 100%; max-width: 400px;">
                <!-- Floating Label Email -->
                <div class="floating-group">
                    <input type="email" id="login-email" placeholder=" " required value="john.doe@gmail.com">
                    <label for="login-email">Email</label>
                </div>

                <!-- Floating Label Password -->
                <div class="floating-group password-group">
                    <input type="password" id="login-password" placeholder=" " required value="••••••••••••••••">
                    <label for="login-password">Password</label>
                    <i class="fa-regular fa-eye toggle-password"></i>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-pass">Forgot Password</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-auth-submit" style="width: 100%; padding: 16px; background-color: #8DD3BB; color: var(--dark); border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Login</button>

                <!-- Sign up link -->
                <p class="auth-redirect">
                    Don’t have an account? <a href="signup.html">Sign up</a>
                </p>

                <!-- Divider -->
                <div class="auth-divider">
                    <span>Or login with</span>
                </div>

                <!-- Social Login Buttons -->
                <div class="social-login-grid">
                    <button type="button" class="btn-social">
                        <i class="fa-brands fa-facebook-f" style="color: #1877F2;"></i>
                    </button>
                    <button type="button" class="btn-social">
                        <i class="fa-brands fa-google" style="color: #EA4335;"></i>
                    </button>
                    <button type="button" class="btn-social">
                        <i class="fa-brands fa-apple" style="color: #000000;"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- Cột bên phải: Banner Slider Image (Đồng bộ giao diện với Signup & Forgot Password) -->
        <div class="auth-banner-side">
            <div class="banner-image-wrapper">
                <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1000&q=80" alt="Resort View">
                <!-- Slider Indicator Dots -->
                <div class="banner-dots">
                    <span class="dot"></span>
                    <span class="dot active"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Script giữ nguyên hoàn toàn tính năng cũ -->
    <script>
        // Toggle ẩn/hiện mật khẩu
        const togglePassword = document.querySelector('.toggle-password');
        const passwordInput = document.getElementById('login-password');

        if(togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        }

        // Logic Đăng nhập giữ nguyên
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const users = JSON.parse(localStorage.getItem('users')) || [];
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                alert('Đăng nhập thành công!');
                localStorage.setItem('currentUser', JSON.stringify(user));
                window.location.href = 'index.html';
            } else {
                alert('Đăng nhập thành công (Chế độ Demo)!');
                localStorage.setItem('currentUser', JSON.stringify({ name: 'John Doe', email: email }));
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
