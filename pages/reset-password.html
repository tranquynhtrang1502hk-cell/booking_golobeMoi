<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a Password - Golobe</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Montserrat) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <!-- Cột bên trái: Form Set a password -->
        <div class="auth-form-side">
            <!-- Logo -->
            <a href="index.html" class="auth-logo">
                <i class="fa-solid fa-paper-plane" style="color: #8DD3BB;"></i>
                <span>g<span style="color: #8DD3BB;">o</span>lobe</span>
            </a>

            <!-- Heading -->
            <div class="auth-header" style="text-align: left; width: 100%; max-width: 400px;">
                <h2 style="font-size: 32px; font-weight: 700; margin-bottom: 8px;">Set a password</h2>
                <p style="color: #79747E; font-size: 14px; margin-bottom: 32px;">Your previous password has been reset. Please set a new password for your account.</p>
            </div>

            <!-- Form -->
            <form id="reset-password-form" style="width: 100%; max-width: 400px;">
                <!-- Floating Label: Create Password -->
                <div class="floating-group password-group">
                    <input type="password" id="new-password" placeholder=" " required>
                    <label for="new-password">Create Password</label>
                    <i class="fa-regular fa-eye toggle-password" data-target="new-password"></i>
                </div>

                <!-- Floating Label: Re-enter Password -->
                <div class="floating-group password-group">
                    <input type="password" id="confirm-password" placeholder=" " required>
                    <label for="confirm-password">Re-enter Password</label>
                    <i class="fa-regular fa-eye toggle-password" data-target="confirm-password"></i>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-auth-submit" style="width: 100%; padding: 16px; background-color: #8DD3BB; color: var(--dark); border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 16px;">Set password</button>

                <!-- Back to login link -->
                <p class="auth-redirect" style="margin-top: 24px;">
                    Remember your password? <a href="login.html">Login</a>
                </p>
            </form>
        </div>

        <!-- Cột bên phải: Banner Slider Image -->
        <div class="auth-banner-side">
            <div class="banner-image-wrapper">
                <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1000&q=80" alt="Resort View">
                <div class="banner-dots">
                    <span class="dot"></span>
                    <span class="dot active"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Script xử lý ẩn hiện mật khẩu và logic đổi mật khẩu -->
    <script>
        // Toggle ẩn/hiện mật khẩu
        const togglePasswordIcons = document.querySelectorAll('.toggle-password');

        togglePasswordIcons.forEach(icon => {
            icon.addEventListener('click', function () {
                const targetId = this.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);

                if (passwordInput) {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                }
            });
        });

        // Xử lý logic Đặt lại mật khẩu mới
        document.getElementById('reset-password-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                alert('Mật khẩu nhập lại không khớp!');
                return;
            }

            alert('Đặt lại mật khẩu thành công! Vui lòng đăng nhập lại.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
