<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Golobe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/signup.css">

</head>
<body>

    <div class="auth-container">
        <div class="auth-image-side">
            <div class="auth-image-card">
                <div class="slider-dots">
                    <span class="dot"></span>
                    <span class="dot active"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>

        <div class="auth-form-side">
            <div class="auth-form-wrapper">
                <a href="index.html" class="auth-logo">
                    <i class="fa-solid fa-paper-plane" style="color: var(--primary);"></i> Golobe
                </a>
                <h1 class="auth-title">Sign up</h1>
                <p class="auth-subtitle">Let’s get you all set up so you can access your personal account.</p>

                <form id="signup-form">
                    <div class="form-row-2">
                        <div class="field-group" style="flex: 1;">
                            <label>First Name</label>
                            <input type="text" id="first-name" placeholder="John" required>
                        </div>
                        <div class="field-group" style="flex: 1;">
                            <label>Last Name</label>
                            <input type="text" id="last-name" placeholder="Doe" required>
                        </div>
                    </div>
                    <div class="field-group">
                        <label>Email</label>
                        <input type="email" id="signup-email" placeholder="john.doe@gmail.com" required>
                    </div>
                    <div class="field-group">
                        <label>Phone Number</label>
                        <input type="text" id="phone-number" placeholder="+1 000-000-0000">
                    </div>
                    <div class="field-group">
                        <label>Password</label>
                        <input type="password" id="signup-password" placeholder="••••••••••••" required>
                    </div>
                    <div class="field-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="••••••••••••" required>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required checked>
                        <label for="terms" style="margin: 0; font-weight: normal;">I agree to all the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policies</a></label>
                    </div>
                    <button type="submit" class="btn-submit">Create account</button>
                </form>

                <div class="auth-footer-text">
                    Already have an account? <a href="login.html">Login</a>
                </div>
                <div class="divider-or">Or sign up with</div>
                <div class="social-login">
                    <button class="social-btn"><i class="fa-brands fa-facebook-f" style="color: #1877F2;"></i></button>
                    <button class="social-btn"><i class="fa-brands fa-google" style="color: #EA4335;"></i></button>
                    <button class="social-btn"><i class="fa-brands fa-apple" style="color: #000;"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const firstName = document.getElementById('first-name').value.trim();
            const lastName = document.getElementById('last-name').value.trim();
            const name = `${firstName} ${lastName}`;
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                alert('Mật khẩu xác nhận không khớp!');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.find(u => u.email === email)) {
                alert('Email đã tồn tại!');
                return;
            }

            const newUser = { name, email, password };
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify(newUser));

            alert('Đăng ký thành công!');

                    window.location.href = 'signup-payment.html';        });
    </script>
</body>
</html>
