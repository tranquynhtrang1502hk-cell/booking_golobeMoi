<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Golobe</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Montserrat) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <!-- Cột bên trái: Form Quên mật khẩu -->
        <div class="auth-form-side">
            <!-- Logo -->
            <a href="index.html" class="auth-logo">
                <i class="fa-solid fa-paper-plane" style="color: #8DD3BB;"></i>
                <span>g<span style="color: #8DD3BB;">o</span>lobe</span>
            </a>

            <!-- Heading -->
            <div class="auth-header" style="text-align: left; width: 100%; max-width: 400px;">
                <h2 style="font-size: 32px; font-weight: 700; margin-bottom: 8px;">Forgot your password?</h2>
                <p style="color: #79747E; font-size: 14px; margin-bottom: 32px;">Don't worry, happens to all of us. Enter your email below to recover your password.</p>
            </div>

            <!-- Form -->
            <form id="forgot-email-form" style="width: 100%; max-width: 400px;">
                <!-- Floating Label Email -->
                <div class="floating-group">
                    <input type="email" id="recovery-email" placeholder=" " required>
                    <label for="recovery-email">Email</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-auth-submit" style="width: 100%; padding: 16px; background-color: #8DD3BB; color: var(--dark); border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 16px;">Submit</button>

                <!-- Back to login link -->
                <p class="auth-redirect" style="margin-top: 24px;">
                    Remember your password? <a href="login.html">Login</a>
                </p>
            </form>
        </div>

        <!-- Cột bên phải: Banner Slider Image -->
        <div class="auth-banner-side">
            <div class="banner-image-wrapper">
                <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1000&q=80" alt="Resort View">
                <div class="banner-dots">
                    <span class="dot"></span>
                    <span class="dot active"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Script xử lý chuyển sang bước tiếp theo -->
    <script>
        document.getElementById('forgot-email-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('recovery-email').value;
            
            // Lưu tạm email vào sessionStorage để bước sau biết đang đổi mật khẩu cho ai (nếu cần)
            sessionStorage.setItem('resetEmail', email);

            alert('Mã xác nhận hoặc liên kết đặt lại mật khẩu đã được gửi tới email của bạn!');
            
            // Chuyển sang trang nhập mã xác nhận (hoặc chuyển thẳng tới trang Set Password)
            window.location.href = 'verify-code.html'; 
        });
    </script>
</body>
</html>
