<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golobe - Sign In / Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="page6.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="auth-container">
        <!-- Form Side -->
        <div class="auth-form-side">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <img src="https://api.iconify.design/ion:paper-plane.svg?color=%238dd3bb" alt="logo" class="logo-icon"> <span>Golobe</span>
                </a>
                <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>

            <div class="auth-content">
                <h2>Login</h2>
                <p class="auth-subtitle">Login to access your Golobe account & travel bookings</p>

                <form class="auth-form">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="john.doe@example.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" placeholder="••••••••••••" required>
                            <i class="fa-regular fa-eye toggle-password"></i>
                        </div>
                    </div>

                    <div class="auth-options">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary btn-full">Login</button>
                </form>

                <div class="divider">
                    <span>Or login with</span>
                </div>

                <div class="social-login-grid">
                    <button class="btn-social"><i class="fa-brands fa-facebook-f social-fb"></i> Facebook</button>
                    <button class="btn-social"><i class="fa-brands fa-google social-gg"></i> Google</button>
                    <button class="btn-social"><i class="fa-brands fa-apple social-apple"></i> Apple</button>
                </div>

                <div class="auth-footer">
                    <span>Don't have an account? <a href="#" class="link-signup">Sign up</a></span>
                </div>
            </div>
        </div>

        <!-- Visual Side -->
        <div class="auth-visual-side" style="background-image: url('https://images.unsplash.com/photo-1506012787146-f92b2d7d6d96?auto=format&fit=crop&w=1000&q=80');">
            <div class="overlay-text">
                <h3>Explore the World with Golobe</h3>
                <p>Book flights, hotels & luxury stays with seamless payment and instant confirmation.</p>
            </div>
        </div>
    </main>

</body>
</html>
